name: packages
# When the 'permissions' key is specified, unspecified permission scopes (e.g.,
# actions, checks, etc.) are set to no access (none).
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      # When git-ref is empty, HEAD will be checked out.
      git-ref:
        description: Optional git ref (branch, tag, or full SHA)
        required: false

jobs:
  sdist:
    runs-on: ubuntu-latest

    steps:
    - name: Clone
      uses: actions/checkout@v4
      with:
        # When the ref is empty, HEAD will be checked out.
        ref: ${{ github.event.inputs.git-ref }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Dependencies
      run: python -m pip install --upgrade pip setuptools

    - name: Build
      run: python setup.py sdist

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: packages-sdist
        path: ./dist

  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Use the oldest version of Ubuntu that supports the versions of Python
        # you're targeting.
        #  > "Building manylinux-compatible wheels is not trivial; as a general
        #    rule, binaries built on one Linux distro will only work on other
        #    Linux distros that are the same age or newer. Therefore, if we
        #    want to make binaries that run on most Linux distros, we have to
        #    use a very old distro -- CentOS 6."
        #  - https://github.com/pypa/manylinux
        os: [macos-latest, windows-latest, ubuntu-22.04, ubuntu-22.04-arm, windows-11-arm]
        # 3.11 builds the cp32-abi3 wheel. It's the earliest Python version
        # available on Windows arm64 runners. 3.12 builds the cp312-abi3 wheel,
        # for subinterpreters with their own GIL. 3.15t builds the
        # cp315-abi3.abi3t wheel (PEP 803), for both free-threaded and
        # GIL-enabled Python 3.15+.
        python-version: ['3.11', '3.12', '3.15t']
        include:
          - {python-version: '3.11', abi: cp32-abi3}
          - {python-version: '3.12', abi: cp312-abi3}
          - {python-version: '3.15t', abi: cp315-abi3.abi3t}

    steps:
    - name: Clone
      uses: actions/checkout@v4
      with:
        # When the ref is empty, HEAD will be checked out.
        ref: ${{ github.event.inputs.git-ref }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Dependencies
      run: python -m pip install --upgrade pip setuptools wheel

    - name: Build
      run: python setup.py bdist_wheel

    - name: manylinux
      if: ${{ startsWith(matrix.os, 'ubuntu-') }}
      run: |
        # Newer versions of auditwheel require a version of patchelf that's not
        # available on Ubuntu 22.04.
        #   https://github.com/pypa/auditwheel/blob/main/CHANGELOG.md#681
        python -m pip install --upgrade auditwheel==6.8.0
        python -m auditwheel show dist/*.whl
        # Use manylinux_2_34, as you can't use an older ABI because of the
        # presence of too-recent versioned symbols. To target manylinux2014,
        # PyPA provides docker images.
        python -m auditwheel repair --plat "manylinux_2_34_$(uname -m)" dist/*.whl
        rm -r dist
        mv wheelhouse dist

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: packages-wheels-${{ matrix.os }}-${{ matrix.abi }}
        path: ./dist

  merge:
    runs-on: ubuntu-latest
    needs: [sdist, wheels]
    steps:
      - name: Merge artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: packages
          pattern: packages-*
          delete-merged: true
