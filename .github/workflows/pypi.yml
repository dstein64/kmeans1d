# Makes sure that wheels have been uploaded for the latest Python version. #6
name: pypi
# When the 'permissions' key is specified, unspecified permission scopes (e.g.,
# actions, checks, etc.) are set to no access (none).
permissions:
  contents: read
on:
  schedule:
    # Run weekly (* is a special character in YAML, so quote the string)
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # As of December 12, 2025, arm runners don't have a "latest" variant.
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
          - ubuntu-22.04-arm
          - windows-11-arm
        freethreaded: [false, true]
    env:
      # Checks that the installed package produces the expected results. It's run with -W error so
      # that warnings, such as the GIL being enabled on free-threaded Python, are treated as errors.
      CHECK: |
        from kmeans1d import cluster
        x = [4.0, 4.1, 4.2, -50, 200.2, 200.4, 200.9, 80, 100, 102]
        clusters, centroids = cluster(x, 4)
        assert clusters == [1, 1, 1, 0, 3, 3, 3, 2, 2, 2], clusters
        assert centroids == [-50.0, 4.1, 94.0, 200.5], centroids

    steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
        freethreaded: ${{ matrix.freethreaded }}

    - name: Check Python version
      run: python --version

    - name: Update pip
      run: python -m pip install --upgrade pip

    - name: Test bdist
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $VERSIONS = python -m pip index versions kmeans1d
        $LATEST = $VERSIONS[0] | ForEach-Object { $_ -replace 'kmeans1d \((.*)\)', '$1' }
        python -m pip install --only-binary :all: "kmeans1d==$LATEST"
        if ($LASTEXITCODE -ne 0) { throw "error" }
        python -W error -c $env:CHECK
        if ($LASTEXITCODE -ne 0) { throw "error" }

    - name: Remove packages
      shell: pwsh
      run: python -m pip freeze | ForEach-Object { python -m pip uninstall --yes $_ }

    - name: Test sdist
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $VERSIONS = python -m pip index versions kmeans1d
        $LATEST = $VERSIONS[0] | ForEach-Object { $_ -replace 'kmeans1d \((.*)\)', '$1' }
        python -m pip install --no-binary :all: "kmeans1d==$LATEST"
        if ($LASTEXITCODE -ne 0) { throw "error" }
        python -W error -c $env:CHECK
        if ($LASTEXITCODE -ne 0) { throw "error" }
